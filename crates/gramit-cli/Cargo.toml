[package]
name = "gramit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "gramit command line interface"

[[bin]]
name = "gramit"
path = "src/main.rs"

[dependencies]
gramit-core = { path = "../gramit-core" }
gramit-input = { path = "../gramit-input" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml = "1.0"
clap = { version = "4", features = ["derive"] }
crossterm.workspace = true
interprocess = { version = "2.4", features = ["tokio"] }
notify-rust = "4"
# The updater asks GitHub for the latest release and downloads the install script.
# Same features as gramit-core's client, so this adds no new dependency tree.
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }

[package]
name = "gramit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared config, IPC protocol, and backend client for gramit"

[dependencies]
directories = "6.0.0"
# rustls, not the system OpenSSL: the backend is reached over https and the binary
# should not need a matching libssl on the user's machine to talk to it.
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
toml = "1.0.7"
tracing.workspace = true

[build-dependencies]
# Reads the backend address out of the workspace deploy.toml. Same crate the runtime
# config uses, so it is already in the lockfile.
toml = "1.0.7"

[workspace]
resolver = "2"
members = ["crates/gramit-cli", "crates/gramit-core", "crates/gramit-input", "crates/gramitd"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
# Raw terminal mode and key events for the arrow-key mode picker. Pure Rust, and the
# same code path on Linux, macOS and Windows, all three of which CI builds.
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Full debuginfo on this dependency tree (tokio, reqwest, zbus, ashpd) costs several
# gigabytes of target/. Line tables still give file:line in backtraces, which is what
# actually matters when debugging the daemon.
[profile.dev]
debug = "line-tables-only"

# Release binaries are downloaded, not built, by nearly everyone who runs gramit, so
# they are tuned for size and speed rather than build time. `panic` is deliberately
# left at "unwind": the daemon runs work on Tokio tasks, and aborting the process on a
# panic in one of them would take the hotkey down with it.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

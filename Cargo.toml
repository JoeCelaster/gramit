[workspace]
resolver = "2"
members = ["crates/gramit-cli", "crates/gramit-core", "crates/gramit-input", "crates/gramitd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Full debuginfo on this dependency tree (tokio, reqwest, zbus, ashpd) costs several
# gigabytes of target/. Line tables still give file:line in backtraces, which is what
# actually matters when debugging the daemon.
[profile.dev]
debug = "line-tables-only"

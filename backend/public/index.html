<h1>gramit backend</h1>
<p>Grammar correction API. Two endpoints:</p>
<ul>
  <li><code>GET /health</code> — liveness, version, and whether an API key is configured</li>
  <li><code>POST /v1/fix</code> — <code>{"text": "...", "mode": "grammar"}</code></li>
</ul>
